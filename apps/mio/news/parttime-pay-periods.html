<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#faf6ef" />
    <title>給与の締め日を設定できるようになりました | MIO</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { background: #faf6ef; color: #2d2038; font-family: system-ui, sans-serif; }

      /* アプリのダイアログに合わせ、幅・高さのどちらが短くても画像全体を出す。 */
      main {
        box-sizing: border-box;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 8px;
      }
      img {
        display: block;
        width: min(100%, 480px);
        height: 100%;
        min-height: 0;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    <main>
      <img
        src="./parttime-pay-periods.webp"
        width="960"
        height="1152"
        alt="MIOアップデート。給与の締め日を設定できるようになりました。15日締めの例は10月16日から11月15日まで。バイト先の編集から設定できます。"
      />
    </main>
  </body>
</html>
